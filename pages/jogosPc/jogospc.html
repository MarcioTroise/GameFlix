    <div class="pesquisa">
        <input id="input" type="search" autocomplete="on" spellcheck="false" placeholder="Pesquise um Jogo">
    </div>

    <div class="jogos-pc">
        <div id="stg-game" class="grid-games">
            <h2 class="estilo-games"> ESTRATEGIA </h2>
            <div class="game-list">
                <figure class="item">
                    <img src="../../img/ESTRATEGIA/estt3.jpg" alt="Jogo Estrategia" class="games">
                    <figcaption class="nome-jogo"> Age of Mythology</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/ESTRATEGIA/estt1.png" alt="" class="games">
                    <figcaption class="nome-jogo">Age of Empires</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/ESTRATEGIA/estt2.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Legends of Runeterra</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/ESTRATEGIA/estt4.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">HeartStone</figcaption>
                </figure>
            </div>
        </div>

        <div id="fps-game" class="grid-games">
            <h2 class="estilo-games"> FPS </h2>
            <div class="game-list">
                <figure class="item">
                    <img src="../../img/FPS/fps1.png" alt="" class="games">
                    <figcaption class="nome-jogo">CounterStrike CS-GO </figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/FPS/fps2.png" alt="" class="games">
                    <figcaption class="nome-jogo">Valorant</figcaption>

                <figure class="item">
                    <img src="../../img/FPS/fps3.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Overwatch</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/FPS/fps4.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Call of Duty</figcaption>
                </figure>
            </div>
        </div>

        <div id="mmo-game" class="grid-games">
            <h2 class="estilo-games"> MMO-RPG </h2>
            <div class="game-list">
                <figure class="item">
                    <img src="../../img/MMO/mmo1.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">World of WarCraft</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MMO/mmo4.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Tibia</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MMO/mmo5.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">The Elder Scrolls online</figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MMO/mmo3.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">New World</figcaption>
                </figure>
            </div>
        </div>

        <div id="moba-game" class="grid-games">
            <h2 class="estilo-games"> MOBA </h2>
            <div class="game-list">
                <figure class="item">
                    <img src="../../img/MOBA/moba1.png" alt="" class="games">
                    <figcaption class="nome-jogo">League of Legends </figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MOBA/moba2.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Dota 2 </figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MOBA/moba3.jpg" alt="" class="games">
                    <figcaption class="nome-jogo">Heroes of the Storm </figcaption>
                </figure>
                <figure class="item">
                    <img src="../../img/MOBA/moba4.jpg" alt="" class="games">
